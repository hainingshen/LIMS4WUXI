                $ref: '#/components/schemas/LegacyStatusMapping'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 200
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Locked:
      description: Locked by business gate
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthToken:
      type: object
      description: |
        JWT pair. Access token TTL is 15 minutes (configurable via system_config
        key AUTH_ACCESS_TOKEN_TTL_MINUTES). Refresh token TTL is 7 days
        (AUTH_REFRESH_TOKEN_TTL_DAYS). Tokens may be revoked via Redis
        blacklist on logout, role change, password update or forced sign-out.
      required: [accessToken, refreshToken, clientType, roles, expiresInSeconds]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        clientType:
          type: string
          enum: [INTERNAL, PORTAL, MOBILE]
        roles:
          type: array
          items:
            type: string
        expiresInSeconds:
          type: integer
          description: Access token TTL in seconds at issue time.
    CurrentUser:
      type: object
      required: [id, username, displayName, clientType, roleCodes, dataScopes]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        clientType:
          type: string
          enum: [INTERNAL, PORTAL, MOBILE]
        customerOrgId:
          type: string
          format: uuid
