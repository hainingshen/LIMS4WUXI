name: lims4wuxi

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lims}
      POSTGRES_USER: ${POSTGRES_USER:-lims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lims_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password}"]
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-limsminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-limsminio_dev_password}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  onlyoffice:
    image: onlyoffice/documentserver:latest
    environment:
      JWT_ENABLED: "false"
    shm_size: "1gb"

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lims}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lims}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-lims_dev_password}
      LIMS_AUTH_JWT_SECRET: ${LIMS_JWT_SECRET:-replace-with-at-least-32-bytes-production-secret}
      LIMS_STORAGE_ENDPOINT: http://minio:9000
      LIMS_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-limsminio}
      LIMS_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-limsminio_dev_password}
      LIMS_STORAGE_BUCKET: lims-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      onlyoffice:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  pgdata: {}
  redisdata: {}
  miniodata: {}
