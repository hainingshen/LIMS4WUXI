name: Backend Verify

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/development/specs/**"
      - "scripts/checks/**"
      - ".github/workflows/backend-verify.yml"
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Python check dependencies
        run: python -m pip install -r scripts/checks/requirements.txt

      - name: Validate specs
        run: python scripts/checks/csv-foreign-key.py

      - name: Detect drift
        run: python scripts/checks/drift-detector.py

      - name: Run backend tests
        working-directory: backend
        run: mvn test
