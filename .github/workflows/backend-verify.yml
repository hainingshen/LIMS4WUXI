name: CI Verify

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install Python check dependencies
        run: python -m pip install -r scripts/checks/requirements.txt

      - name: Validate specs
        run: python scripts/checks/csv-foreign-key.py

      - name: Detect drift
        run: python scripts/checks/drift-detector.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend typecheck
        run: pnpm -r typecheck

      - name: Run backend tests
        working-directory: backend
        run: mvn test
