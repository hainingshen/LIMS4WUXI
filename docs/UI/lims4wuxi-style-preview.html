<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LIMS4WUXI · 视觉风格预览</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@5.16.1/dist/antd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/antd@5.16.1/dist/reset.css" />
<script src="https://unpkg.com/@ant-design/icons@5.3.5/dist/index.umd.min.js"></script>
<script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
:root{
  --primary:#1A5FB4;
  --primary-700:#144A8E;
  --primary-50:#EEF4FB;
  --accent:#00A8A8;
  --accent-50:#E6F6F6;
  --success:#10B981;
  --warning:#F59E0B;
  --danger:#EF4444;
  --ink-900:#0F172A;
  --ink-600:#475569;
  --ink-400:#94A3B8;
  --line:#E2E8F0;
  --bg:#F8FAFC;
  --card-shadow:0 1px 3px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink-900);font-family:"Noto Sans SC","Inter",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.en,.num,[data-en]{font-family:"Inter","Noto Sans SC",sans-serif;letter-spacing:.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

.page{max-width:1320px;margin:0 auto;padding:48px 32px 96px}
.hero{background:linear-gradient(135deg,#0E3A6E 0%,#1A5FB4 55%,#1F77C9 100%);color:#fff;border-radius:16px;padding:40px 48px;position:relative;overflow:hidden;box-shadow:0 12px 40px rgba(20,74,142,.25)}
.hero::after{content:"";position:absolute;inset:0;background:
  radial-gradient(800px 300px at 90% -10%,rgba(0,168,168,.35),transparent 60%),
  radial-gradient(600px 240px at 10% 110%,rgba(255,255,255,.12),transparent 60%);
  pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;position:relative;z-index:1}
.hero h1{font-size:34px;font-weight:700;letter-spacing:.02em;margin:0 0 8px}
.hero .sub{opacity:.85;font-size:15px;margin-bottom:24px}
.hero .meta{display:flex;gap:24px;flex-wrap:wrap}
.hero .meta .item{font-size:13px;opacity:.85}
.hero .meta .item b{display:block;font-size:20px;font-weight:600;opacity:1;margin-top:2px;font-family:"Inter",sans-serif}
.creds{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.cred{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);font-size:13px;font-weight:500;backdrop-filter:blur(6px)}
.cred .dot{width:6px;height:6px;border-radius:50%;background:#7FE7E7}
.hero-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:20px;backdrop-filter:blur(6px)}
.hero-card h4{font-size:13px;font-weight:500;margin:0 0 14px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.hero-card .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed rgba(255,255,255,.15);font-size:13px}
.hero-card .row:last-child{border-bottom:0}
.hero-card .row span:last-child{font-family:"Inter",sans-serif;font-weight:500}

section{margin-top:56px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:12px}
.section-head h2{font-size:13px;font-weight:600;letter-spacing:.18em;color:var(--ink-600);margin:0;text-transform:uppercase;font-family:"Inter",sans-serif}
.section-head .zh{font-size:20px;font-weight:600;color:var(--ink-900);margin-left:14px}
.section-head .desc{color:var(--ink-400);font-size:13px}

/* Color palette */
.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.swatch{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--card-shadow)}
.swatch .chip{height:96px;display:flex;align-items:flex-end;padding:14px;color:#fff;font-family:"Inter",sans-serif;font-weight:500;font-size:13px;letter-spacing:.04em}
.swatch .meta{padding:12px 14px}
.swatch .meta .name{font-size:13px;font-weight:600;color:var(--ink-900)}
.swatch .meta .hex{font-size:12px;color:var(--ink-400);font-family:"JetBrains Mono",monospace;margin-top:2px}
.swatch .meta .use{font-size:12px;color:var(--ink-600);margin-top:6px;line-height:1.5}
.neutral-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:16px}
.neutral{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.neutral .bar{height:48px}
.neutral .lbl{padding:8px 10px;font-size:12px;color:var(--ink-600);display:flex;justify-content:space-between}
.neutral .lbl .hex{font-family:"JetBrains Mono",monospace;color:var(--ink-400)}

/* Typography */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.type-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:var(--card-shadow)}
.type-card .label{font-family:"Inter",sans-serif;font-size:11px;color:var(--ink-400);letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
.t-display{font-size:36px;font-weight:600;line-height:1.25}
.t-h1{font-size:24px;font-weight:600}
.t-h2{font-size:20px;font-weight:600}
.t-h3{font-size:16px;font-weight:600}
.t-body{font-size:14px;color:var(--ink-900)}
.t-secondary{font-size:13px;color:var(--ink-600)}
.t-help{font-size:12px;color:var(--ink-400)}
.t-stat{font-size:32px;font-weight:600;font-family:"Inter",sans-serif;letter-spacing:-.01em}
.bilingual{display:flex;gap:12px;align-items:baseline}
.bilingual .zh{font-size:15px;font-weight:500;color:var(--ink-900)}
.bilingual .en{font-size:13px;color:var(--ink-600)}

/* Components */
.comp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.comp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:var(--card-shadow)}
.comp h5{margin:0 0 14px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-400);font-family:"Inter",sans-serif}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:4px;font-size:12px;font-weight:500;border:1px solid transparent}
.tag .d{width:6px;height:6px;border-radius:50%}
.tag-blue{background:#EEF4FB;color:#1A5FB4;border-color:#CFE0F4}
.tag-cyan{background:#E6F6F6;color:#0E7A7A;border-color:#B7E3E3}
.tag-green{background:#ECFDF5;color:#047857;border-color:#A7F3D0}
.tag-amber{background:#FEF3C7;color:#92400E;border-color:#FDE68A}
.tag-red{background:#FEE2E2;color:#991B1B;border-color:#FECACA}
.tag-grey{background:#F1F5F9;color:#475569;border-color:#E2E8F0}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-size:13px;padding:8px 16px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-700)}
.btn-default{background:#fff;border-color:var(--line);color:var(--ink-900)}
.btn-default:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--primary)}
.btn-danger{background:#fff;border-color:#FECACA;color:var(--danger)}
.stat-row{display:flex;gap:24px}
.stat{flex:1}
.stat .lbl{font-size:12px;color:var(--ink-600);margin-bottom:4px}
.stat .val{font-family:"Inter",sans-serif;font-size:28px;font-weight:600;color:var(--ink-900);letter-spacing:-.01em}
.stat .val small{font-size:14px;font-weight:500;color:var(--ink-400);margin-left:2px}
.stat .delta{font-size:12px;margin-top:4px}
.delta.up{color:var(--success)}
.delta.down{color:var(--danger)}

/* Timeline preview */
.tl{display:flex;align-items:center;gap:0}
.tl .node{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.tl .node .c{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600;font-family:"Inter",sans-serif}
.tl .node .lbl{font-size:11px;color:var(--ink-600);margin-top:6px;text-align:center;line-height:1.3}
.tl .bar{flex:0 0 18px;height:2px;background:var(--line);margin:0 -2px;margin-top:-22px}
.tl .done .c{background:var(--primary)}
.tl .done .lbl{color:var(--ink-900);font-weight:500}
.tl .cur .c{background:var(--accent);box-shadow:0 0 0 4px rgba(0,168,168,.18)}
.tl .cur .lbl{color:var(--accent);font-weight:600}
.tl .future .c{background:#fff;border:2px solid var(--line);color:var(--ink-400)}
.tl .done.bar,.tl .cur.bar{background:linear-gradient(90deg,var(--primary),var(--accent))}

/* Page index grid */
.idx-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.idx-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--card-shadow);cursor:pointer;transition:all .15s;position:relative}
.idx-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 20px rgba(20,74,142,.1)}
.idx-card.star::after{content:"⭐";position:absolute;top:10px;right:12px;font-size:12px}
.idx-card .code{font-family:"Inter",sans-serif;font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.1em}
.idx-card .title{font-size:14px;font-weight:600;color:var(--ink-900);margin-top:6px}
.idx-card .en{font-size:11px;color:var(--ink-400);font-family:"Inter",sans-serif;margin-top:2px}
.idx-card .role{margin-top:10px;font-size:11px;color:var(--ink-600);display:flex;gap:6px;flex-wrap:wrap}
.idx-card .role b{background:#F1F5F9;padding:1px 8px;border-radius:4px;font-weight:500}
.idx-group-h{grid-column:1/-1;font-size:11px;font-weight:600;color:var(--ink-400);letter-spacing:.16em;text-transform:uppercase;margin-top:8px;font-family:"Inter",sans-serif}
.idx-group-h:first-child{margin-top:0}

/* P6 mockup */
.mock{background:#F1F5F9;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--card-shadow);overflow:hidden}
.mock-window{background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.mock-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#FAFBFD}
.mock-bar .dot{width:10px;height:10px;border-radius:50%}
.dot-r{background:#FF5F57}.dot-y{background:#FEBC2E}.dot-g{background:#28C840}
.mock-bar .url{margin-left:14px;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-400);background:#F1F5F9;padding:3px 10px;border-radius:6px;flex:1;max-width:480px}
.mock-bar .badge{margin-left:auto;font-size:11px;color:var(--ink-600)}

.app{display:grid;grid-template-columns:240px 1fr;min-height:760px;background:#fff}
.side{background:#0E2E5A;color:#fff;padding:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
.side .brand{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}
.side .brand .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1A5FB4,#00A8A8);display:flex;align-items:center;justify-content:center;font-family:"Inter",sans-serif;font-weight:700;font-size:14px}
.side .brand .t{font-size:13px;font-weight:600;line-height:1.3}
.side .brand .t small{display:block;font-size:11px;opacity:.6;font-weight:400;margin-top:2px}
.side .nav{padding:12px 8px;flex:1}
.side .nav .g{font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.4);padding:14px 12px 6px;font-family:"Inter",sans-serif}
.side .nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:6px;color:rgba(255,255,255,.78);font-size:13px;text-decoration:none;margin-bottom:2px;cursor:pointer}
.side .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side .nav a.active{background:rgba(0,168,168,.18);color:#fff;border-left:2px solid var(--accent);padding-left:10px}
.side .nav a .ic{width:16px;text-align:center;opacity:.7}
.side .me{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}
.side .me .av{width:32px;height:32px;border-radius:50%;background:#1A5FB4;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.side .me .nm{font-size:13px}
.side .me .nm small{display:block;font-size:11px;opacity:.6;margin-top:1px}

.main{display:flex;flex-direction:column;min-width:0}
.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px;background:#fff}
.top .crumbs{font-size:13px;color:var(--ink-600)}
.top .crumbs b{color:var(--ink-900);font-weight:500}
.top .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#F1F5F9;border-radius:6px;padding:6px 12px;width:280px;font-size:13px;color:var(--ink-400)}
.top .search .kbd{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;padding:1px 6px;background:#fff;border:1px solid var(--line);border-radius:4px;color:var(--ink-600)}
.top .creds-mini{display:flex;gap:6px}
.top .creds-mini .c{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;border:1px solid;font-family:"Inter",sans-serif}
.top .creds-mini .cma{color:#0E7A7A;border-color:#B7E3E3;background:#E6F6F6}
.top .creds-mini .cnas{color:#1A5FB4;border-color:#CFE0F4;background:#EEF4FB}
.top .user{display:flex;align-items:center;gap:8px;font-size:13px}
.top .user .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#1A5FB4,#00A8A8);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}

.content{padding:24px;background:var(--bg);flex:1;overflow:hidden}
.h-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
.h-row h1{font-size:22px;font-weight:600;margin:0}
.h-row .sub{font-size:13px;color:var(--ink-600);margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fchip{font-size:12px;padding:5px 12px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--ink-600);cursor:pointer}
.fchip.on{background:var(--primary-50);border-color:#A8C5E8;color:var(--primary)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--card-shadow);position:relative;overflow:hidden}
.kpi .accent{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.kpi.k-accent .accent{background:var(--accent)}
.kpi.k-warn .accent{background:var(--warning)}
.kpi.k-danger .accent{background:var(--danger)}
.kpi.k-success .accent{background:var(--success)}
.kpi .l{font-size:12px;color:var(--ink-600);display:flex;justify-content:space-between;align-items:center}
.kpi .l .more{font-size:11px;color:var(--ink-400)}
.kpi .v{font-size:30px;font-weight:600;font-family:"Inter",sans-serif;color:var(--ink-900);margin-top:4px;letter-spacing:-.01em}
.kpi .v small{font-size:13px;color:var(--ink-400);font-weight:500;margin-left:4px}
.kpi .foot{font-size:11px;color:var(--ink-600);margin-top:6px;display:flex;gap:10px}
.kpi .foot .up{color:var(--success)}
.kpi .foot .dn{color:var(--danger)}
.kpi .mini-pie{position:absolute;right:14px;top:14px;width:54px;height:54px}

.grid3{display:grid;grid-template-columns:0.95fr 1.3fr 0.95fr;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;min-height:340px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.panel .ph h3{font-size:14px;font-weight:600;margin:0;color:var(--ink-900)}
.panel .ph .a{font-size:12px;color:var(--primary);cursor:pointer}

.pie-box{display:flex;gap:14px;align-items:center}
.pie{width:120px;height:120px;flex:0 0 auto}
.legend{display:flex;flex-direction:column;gap:8px;font-size:12px;flex:1}
.legend .it{display:flex;justify-content:space-between;align-items:center}
.legend .it .l{display:flex;gap:8px;align-items:center;color:var(--ink-600)}
.legend .it .d{width:8px;height:8px;border-radius:2px}
.legend .it .n{font-family:"Inter",sans-serif;font-weight:600;color:var(--ink-900)}

.risk-list{margin-top:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.risk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#FCFDFE}
.risk .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.risk .pid{font-family:"Inter",sans-serif;font-size:12px;font-weight:600;color:var(--ink-900)}
.risk .score{font-family:"Inter",sans-serif;font-size:13px;font-weight:600}
.risk .score.r{color:var(--danger)}
.risk .score.w{color:var(--warning)}
.risk .nm{font-size:12px;color:var(--ink-600)}
.risk .why{font-size:11px;color:var(--ink-400);margin-top:4px}

.block-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.block-col{background:#FAFBFD;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:280px}
.block-col h4{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-400);margin:0 0 4px;font-family:"Inter",sans-serif;display:flex;justify-content:space-between}
.block-col h4 .n{color:var(--ink-900);background:#fff;padding:1px 7px;border-radius:999px;border:1px solid var(--line);font-size:11px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px}
.bcard .l1{display:flex;justify-content:space-between;align-items:center}
.bcard .pid{font-family:"Inter",sans-serif;font-size:11px;color:var(--ink-600);font-weight:600}
.bcard .dur{font-size:11px;color:var(--danger)}
.bcard .dur.w{color:var(--warning)}
.bcard .ds{font-size:12px;color:var(--ink-900);margin:4px 0;line-height:1.45}
.bcard .owner{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--ink-600)}
.bcard .owner .av{width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600;font-family:"Inter",sans-serif}

.heat-wrap{flex:1;display:flex;flex-direction:column}
.heat{display:grid;grid-template-columns:64px repeat(7,1fr);gap:3px;font-size:11px;flex:1}
.heat .hh{font-size:11px;color:var(--ink-400);padding:2px 0;text-align:center;font-family:"Inter",sans-serif}
.heat .nm{font-size:12px;color:var(--ink-600);display:flex;align-items:center}
.heat .cell{border-radius:3px;height:22px;display:flex;align-items:center;justify-content:center;font-family:"Inter",sans-serif;font-size:10px;color:#fff}
.h0{background:#F1F5F9;color:var(--ink-400)}
.h1{background:#CFE0F4;color:#1A5FB4}
.h2{background:#7FAEDB}
.h3{background:#1A5FB4}
.h4{background:#0E3A6E}
.h-over{background:#EF4444}

function Timeline14(){

  const cur = 6;
  return (
    <div className="tl">

        return (

              <div className="c">{i < cur ? '✓' : i === cur ? '●' : i+1}</div>

            </div>
            {i < 13 && <div className={'bar ' + (i < cur ? 'done' : '')}></div>}

        );

  );
}
