openapi: 3.0.3
info:
  title: LIMS4WUXI API
  version: 0.1.0
  description: Core API skeleton for first-phase Vibe Coding.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/internal/login:
    post:
      summary: Internal user login
      operationId: loginInternal
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
  /auth/portal/login:
    post:
      summary: Customer portal login
      operationId: loginPortal
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
  /auth/refresh:
    post:
      summary: Refresh access token
      operationId: refreshToken
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refreshed token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
  /auth/logout:
    post:
      summary: Logout current session and blacklist tokens
      operationId: logout
      tags: [Auth]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      summary: Get current authenticated user, roles and data scopes
      operationId: getCurrentUser
      tags: [Auth]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
  /customer-orgs:
    get:
      summary: List customer organizations
      operationId: listCustomerOrgs
      tags: [Customers]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paged customer organizations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerOrg'
    post:
      summary: Create or update customer organization
      operationId: upsertCustomerOrg
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOrgUpsertRequest'
      responses:
        '200':
          description: Saved customer organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrg'
  /portal-users:
    get:
      summary: List customer portal users
      operationId: listPortalUsers
      tags: [Customers]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: customerOrgId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged customer portal users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PortalUser'
    post:
      summary: Invite or create customer portal user
      operationId: createPortalUser
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalUserCreateRequest'
      responses:
        '201':
          description: Created portal user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUser'
  /submissions:
    get:
      summary: List submissions
      operationId: listSubmissions
      tags: [Submissions]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged submissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Submission'
    post:
      summary: Create submission
      operationId: createSubmission
      tags: [Submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreateRequest'
      responses:
        '201':
          description: Created submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
  /submissions/{id}:
    patch:
      summary: Update submission draft data before contract lock
      operationId: updateSubmission
      tags: [Submissions]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreateRequest'
      responses:
        '200':
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '409':
          description: Locked field requires change request
  /submissions/{id}/submit:
    post:
      summary: Submit customer submission
      operationId: submitSubmission
      tags: [Submissions]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
  /submissions/{id}/accept:
    post:
      summary: Accept submission after internal review
      operationId: acceptSubmission
      tags: [Submissions]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Accepted submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
  /submissions/{id}/split-projects:
    post:
      summary: Split accepted submission into projects
      operationId: splitSubmissionProjects
      tags: [Submissions]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionSplitProjectsRequest'
      responses:
        '201':
          description: Created projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
  /projects:
    get:
      summary: List projects
      operationId: listProjects
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
  /projects/{id}/nonstandard-review/start:
    post:
      summary: Start non-standard pre-quotation review
      operationId: startNonstandardReview
      tags: [Projects]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{projectId}/nonstandard-review/approve:
    post:
      summary: Approve non-standard review by business entity id
      operationId: approveNonstandardReview
      tags: [Projects]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{id}/quotations:
    post:
      summary: Create quotation for project after quotation gate is open
      operationId: createProjectQuotation
      tags: [Quotations]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuotationCreateRequest'
      responses:
        '201':
          description: Created quotation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quotation'
  /quotations:
    get:
      summary: List quotations
      operationId: listQuotations
      tags: [Quotations]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged quotations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Quotation'
  /contracts:
    get:
      summary: List contracts and agreements
      operationId: listContracts
      tags: [Contracts]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged contracts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Contract'
    post:
      summary: Create contract or agreement
      operationId: createContract
      tags: [Contracts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractCreateRequest'
      responses:
        '201':
          description: Created contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
  /contracts/{id}/mark-signed:
    post:
      summary: Mark contract or agreement as signed
      operationId: markContractSigned
      tags: [Contracts]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractMarkSignedRequest'
      responses:
        '200':
          description: Signed contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
  /samples:
    get:
      summary: List samples
      operationId: listSamples
      tags: [Samples]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged samples
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Sample'
  /samples/{id}/receive:
    post:
      summary: Receive and check sample
      operationId: receiveSample
      tags: [Samples]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleReceiveRequest'
      responses:
        '200':
          description: Updated sample
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
  /samples/{id}/stock-in:
    post:
      summary: Stock in sample after check is passed
      operationId: stockInSample
      tags: [Samples]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleStockInRequest'
      responses:
        '200':
          description: Stocked sample
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
  /samples/{id}/photos:
    post:
      summary: Upload sample photo
      operationId: uploadSamplePhoto
      tags: [Samples]
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: note
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded sample photo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamplePhoto'
  /study-plans:
    get:
      summary: List study plans
      operationId: listStudyPlans
      tags: [StudyPlans]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged study plans
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/StudyPlan'
    post:
      summary: Create study plan
      operationId: createStudyPlan
      tags: [StudyPlans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyPlanCreateRequest'
      responses:
        '201':
          description: Created study plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
  /study-plans/{id}/submit-review:
    post:
      summary: Submit study plan for SD, QA or ethics review
      operationId: submitStudyPlanReview
      tags: [StudyPlans]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Submitted study plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
  /study-plans/{id}/dispatch:
    post:
      summary: Dispatch approved study plan and create executable work orders
      operationId: dispatchStudyPlan
      tags: [StudyPlans]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Dispatched study plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlan'
  /work-orders:
    get:
      summary: List work orders
      operationId: listWorkOrders
      tags: [WorkOrders]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged work orders
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkOrder'
  /work-orders/{id}/start:
    post:
      summary: Start work order
      operationId: startWorkOrder
      tags: [WorkOrders]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Updated work order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
  /work-orders/{id}/submit-raw-record:
    post:
      summary: Submit raw record for work order review
      operationId: submitWorkOrderRawRecord
      tags: [RawRecords]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawRecordSubmitRequest'
      responses:
        '200':
          description: Submitted raw record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawRecord'
  /raw-records:
    get:
      summary: List raw records
      operationId: listRawRecords
      tags: [RawRecords]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: workOrderId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged raw records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RawRecord'
  /raw-records/{id}/review:
    post:
      summary: Review submitted raw record
      operationId: reviewRawRecord
      tags: [RawRecords]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Reviewed raw record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawRecord'
  /reports:
    get:
      summary: List reports
      operationId: listReports
      tags: [Reports]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Report'
  /reports/generate-draft:
    post:
      summary: Generate draft report
      operationId: generateDraftReport
      tags: [Reports]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportGenerateDraftRequest'
      responses:
        '201':
          description: Draft report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
  /reports/{id}/official-pdf:
    get:
      summary: Download official PDF when payment gate is unlocked
      operationId: downloadOfficialPdf
      tags: [Reports]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: PDF binary
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '423':
          $ref: '#/components/responses/Locked'
  /reports/{id}/submit-qc:
    post:
      summary: Submit draft report to QC review
      operationId: submitReportQc
      tags: [Reports]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Report in QC review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
  /reports/{id}/issue:
    post:
      summary: Issue approved report by authorized signatory
      operationId: issueReport
      tags: [Reports]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Issued report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
  /reports/{reportId}/review:
    post:
      summary: Review report by business entity id
      operationId: reviewReport
      tags: [Reports]
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Updated report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
  /payment-receipts:
    get:
      summary: List payment receipts
      operationId: listPaymentReceipts
      tags: [Payments]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged payment receipts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PaymentReceipt'
    post:
      summary: Register payment receipt
      operationId: createPaymentReceipt
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentReceiptCreateRequest'
      responses:
        '201':
          description: Created payment receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentReceipt'
  /green-channel-requests:
    get:
      summary: List green channel requests
      operationId: listGreenChannelRequests
      tags: [GreenChannel]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged green channel requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/GreenChannelRequest'
    post:
      summary: Create green channel request for early electronic report release
      operationId: createGreenChannelRequest
      tags: [GreenChannel]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GreenChannelCreateRequest'
      responses:
        '201':
          description: Created green channel request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GreenChannelRequest'
  /green-channel-requests/{id}/approve:
    post:
      summary: Approve green channel request by business entity id
      operationId: approveGreenChannelRequest
      tags: [GreenChannel]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '204':
          description: Approved or rejected
  /change-requests:
    get:
      summary: List unified change requests
      operationId: listChangeRequests
      tags: [ChangeRequests]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged change requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageResponse'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChangeRequest'
    post:
      summary: Create unified change request
      operationId: createChangeRequest
      tags: [ChangeRequests]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequestCreateRequest'
      responses:
        '201':
          description: Created change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
  /change-requests/{id}/submit:
    post:
      summary: Submit change request for approval
      operationId: submitChangeRequest
      tags: [ChangeRequests]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Submitted change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
  /change-requests/{id}/approve:
    post:
      summary: Approve or reject change request
      operationId: approveChangeRequest
      tags: [ChangeRequests]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Reviewed change request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeRequest'
  /change-requests/{id}/effect:
    post:
      summary: Apply approved change request to target entity
      operationId: effectChangeRequest
      tags: [ChangeRequests]
      parameters:
        - $ref: '#/components/parameters/Id'
