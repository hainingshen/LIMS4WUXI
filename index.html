<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车机探测台</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 760px; margin: 0 auto; padding: 16px; background: #101214; color: #e6e6e6; }
  h1 { font-size: 1.25rem; }
  h2 { font-size: 1rem; margin-top: 1.4em; border-bottom: 1px solid #333; padding-bottom: 4px; }
  .ua { background: #1c1f22; border: 2px solid #e5534b; border-radius: 8px; padding: 10px; font-size: 0.85rem; word-break: break-all; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  td { padding: 6px 4px; border-bottom: 1px solid #26292d; vertical-align: middle; }
  a.btn, button.btn { display: inline-block; padding: 6px 12px; background: #1f6feb; border: none; border-radius: 6px; text-decoration: none; color: #fff; font-size: 0.85rem; margin-right: 6px; cursor: pointer; }
  a.jump { background: #6e40c9; }
  #log { background: #000; color: #7ee787; font-family: monospace; font-size: 0.8rem; padding: 10px; border-radius: 8px; height: 160px; overflow-y: scroll; white-space: pre-wrap; word-break: break-all; }
  .hint { font-size: 0.8rem; color: #9da7b1; }
  iframe#probe { width: 1px; height: 1px; border: 0; position: absolute; left: -9999px; }
</style>
</head>
<body>
<h1>车机探测台（iframe 模式，点测不跳页）</h1>

<h2>浏览器身份</h2>
<div class="ua" id="ua">检测中…</div>

<h2>JS 桥探测</h2>
<div class="ua" id="jsbridge">检测中…</div>

<h2>协议探测（蓝色=iframe 试，不跳页；紫色=直跳，会离开本页）</h2>
<p class="hint">先点蓝色按钮连测。若某个链接让车机真的弹出了应用/界面，记下编号发我。全部无效再考虑紫色直跳。</p>
<table id="tests"></table>

<h2>JS 对话框能力</h2>
<div>
  <button class="btn" onclick="alert('ALERT_OK')">alert</button>
  <button class="btn" onclick="var r=prompt('PROMPT_TEST','');log('prompt 返回: '+r)">prompt</button>
  <button class="btn" onclick="log('confirm 返回: '+confirm('CONFIRM_TEST'))">confirm</button>
</div>
<p class="hint">若 prompt 弹出了系统原生输入框，说明宿主没禁用 JS 对话框，可能有 prompt 桥可用。</p>

<h2>尝试日志</h2>
<div id="log"></div>
<button class="btn" onclick="document.getElementById('log').textContent=''">清空日志</button>

<iframe id="probe" src="about:blank"></iframe>

<script>
var TESTS = [
  ['tel:10086', '拨号'],
  ['sms:10086', '短信'],
  ['mailto:test@test.com', '邮件'],
  ['geo:31.57,120.30', '地图'],
  ['market://details?id=com.android.settings', '商店'],
  ['wtai://wp/mc;10086', '老式拨号wtai'],
  ['intent:#Intent;action=android.settings.DEVICE_INFO_SETTINGS;end', 'intent 关于(纯action)'],
  ['intent:#Intent;action=android.settings.DEVICE_INFO_SETTINGS;component=com.android.settings/.Settings$DeviceInfoSettingsActivity;end', 'intent 关于(手机组件)'],
  ['intent:#Intent;action=android.settings.DEVICE_INFO_SETTINGS;package=com.android.car.settings;end', 'intent 关于(车机包)'],
  ['intent:#Intent;component=com.android.settings/.Settings;end', 'intent 设置主页(组件)'],
  ['file:///system/build.prop', 'file 系统文件'],
  ['file:///android_asset/', 'file 资产目录'],
  ['content://settings/system', 'content 协议'],
  ['about:blank', 'about:blank'],
  ['javascript:void(0)', 'javascript: 空操作']
];

function log(msg) {
  var el = document.getElementById('log');
  var t = new Date().toLocaleTimeString();
  el.textContent += '[' + t + '] ' + msg + '\n';
  el.scrollTop = el.scrollHeight;
}

function iframeTry(url, name) {
  var f = document.getElementById('probe');
  log('iframe 尝试: ' + name + ' -> ' + url);
  try { f.src = url; } catch (e) { log('异常: ' + e.message); }
  setTimeout(function(){ try { f.src = 'about:blank'; } catch(e){} }, 2000);
}

var html = '';
TESTS.forEach(function(t, i) {
  html += '<tr><td>' + (i+1) + '. ' + t[1] + '</td>' +
    '<td><button class="btn" onclick="iframeTry(\'' + t[0].replace(/'/g, "\\'") + '\',\'' + t[1] + '\')">iframe试</button>' +
    '<a class="btn jump" href="' + t[0].replace(/"/g, '&quot;') + '">直跳</a></td></tr>';
});
document.getElementById('tests').innerHTML = html;

document.getElementById('ua').textContent = navigator.userAgent;

var found = [];
for (var k in window) {
  if (/bridge|app|native|android|hiphi|hmi|car|vehicle|jsi|exec/i.test(k) && typeof window[k] === 'object') found.push(k);
}
document.getElementById('jsbridge').textContent =
  '可疑 JS 对象: ' + (found.length ? found.join(', ') : '（未发现）');
log('页面加载完成，UA 与 JS 桥已检测');
</script>
</body>
</html>
