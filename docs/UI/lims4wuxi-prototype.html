<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LIMS4WUXI · 高保真原型 · 16 页</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/dayjs@1.11.10/dayjs.min.js"></script>
<script src="https://unpkg.com/antd@5.16.1/dist/antd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/antd@5.16.1/dist/reset.css" />
<script src="https://unpkg.com/@ant-design/icons@5.3.5/dist/index.umd.min.js"></script>
<script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
:root{
  --primary:#1A5FB4; --primary-700:#144A8E; --primary-50:#EEF4FB; --primary-deep:#0E2E5A;
  --accent:#00A8A8; --accent-50:#E6F6F6; --accent-700:#0E7A7A;
  --success:#10B981; --success-50:#ECFDF5;
  --warning:#F59E0B; --warning-50:#FEF3C7;
  --danger:#EF4444; --danger-50:#FEE2E2;
  --ink-900:#0F172A; --ink-700:#334155; --ink-600:#475569; --ink-400:#94A3B8; --ink-300:#CBD5E1;
  --line:#E2E8F0; --line-soft:#F1F5F9; --bg:#F8FAFC; --bg-card:#FCFDFE;
  --card-shadow:0 1px 3px rgba(15,23,42,.06);
  --card-shadow-hi:0 8px 28px rgba(15,23,42,.10);
  --r:8px; --r-lg:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#EEF1F5;color:var(--ink-900);font-family:"Noto Sans SC","Inter",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
#root{height:100vh;width:100vw}
.en,.num,.mono,[data-en]{font-family:"Inter","Noto Sans SC",sans-serif;letter-spacing:.01em}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* ============ HOST SHELL ============ */
.host{display:grid;grid-template-columns:264px 1fr;height:100vh;background:#0B1A30}
.host.collapsed{grid-template-columns:56px 1fr}
.host-side{background:#0B1A30;color:#fff;overflow:hidden;display:flex;flex-direction:column;border-right:1px solid #1B2942}
.host-brand{padding:18px 18px;border-bottom:1px solid #1B2942;display:flex;align-items:center;gap:12px;cursor:pointer}
.host-brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1A5FB4,#00A8A8);display:flex;align-items:center;justify-content:center;font-family:"Inter",sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;color:#fff;flex-shrink:0}
.host-brand .t{font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap}
.host-brand .t small{display:block;font-size:11px;opacity:.55;font-weight:400;margin-top:2px;font-family:"Inter",sans-serif;letter-spacing:.05em}
.host.collapsed .host-brand .t{display:none}
.host-search{padding:10px 14px;border-bottom:1px solid #1B2942}
.host-search input{width:100%;background:#142547;border:1px solid #1F3057;color:#fff;border-radius:6px;padding:7px 12px;font-size:12px;outline:none;font-family:inherit}
.host-search input::placeholder{color:#5D7AA8}
.host.collapsed .host-search{display:none}
.host-pages{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:thin;scrollbar-color:#1B2942 transparent}
.host-pages::-webkit-scrollbar{width:6px}
.host-pages::-webkit-scrollbar-thumb{background:#1B2942;border-radius:3px}
.host-g{font-size:10px;font-weight:600;letter-spacing:.18em;color:#5D7AA8;padding:14px 18px 6px;font-family:"Inter",sans-serif;text-transform:uppercase}
.host.collapsed .host-g{display:none}
.host-page{display:flex;align-items:center;gap:10px;padding:8px 18px;margin:0 6px;border-radius:6px;color:rgba(255,255,255,.78);font-size:13px;cursor:pointer;border:1px solid transparent}
.host-page:hover{background:#142547;color:#fff}
.host-page.active{background:linear-gradient(90deg,rgba(26,95,180,.30),rgba(0,168,168,.15));color:#fff;border-color:#234274}
.host-page .code{font-family:"Inter",sans-serif;font-size:10px;font-weight:600;background:#1F3057;color:#9EBEE8;padding:2px 6px;border-radius:4px;letter-spacing:.04em;min-width:30px;text-align:center;flex-shrink:0}
.host-page.active .code{background:var(--accent);color:#fff}
.host-page .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.host-page .star{font-size:10px;opacity:.7;flex-shrink:0}
.host.collapsed .host-page{padding:8px 0;justify-content:center;margin:2px 6px}
.host.collapsed .host-page .nm,.host.collapsed .host-page .star{display:none}
.host-foot{padding:12px 18px;border-top:1px solid #1B2942;font-size:11px;color:#5D7AA8;display:flex;justify-content:space-between;align-items:center}
.host.collapsed .host-foot span{display:none}
.host-toggle{background:#142547;color:#9EBEE8;width:28px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;border:1px solid #1F3057}
.host-stage{background:#EEF1F5;overflow:auto;height:100vh;position:relative}

/* Mobile frame wrapper */
.mobile-stage{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:radial-gradient(circle at 50% 30%,#1E2E4A 0%,#0B1A30 100%)}
.mobile-frame{width:390px;height:844px;background:#000;border-radius:46px;padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.4),0 0 0 1px #2A3A5A;position:relative;flex-shrink:0}
.mobile-frame::before{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:0 0 18px 18px;z-index:10}
.mobile-screen{width:100%;height:100%;background:#F8FAFC;border-radius:34px;overflow:hidden;position:relative}
.mobile-status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-family:"Inter",sans-serif;font-size:14px;font-weight:600;color:#0F172A}
.mobile-status .time{margin-top:6px}
.mobile-status .icons{display:flex;gap:5px;align-items:center;font-size:11px}
.mobile-context{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:14px;color:#fff;padding-top:24px}
.mobile-context h3{font-size:18px;font-weight:600;color:#fff;margin:0}
.mobile-context p{font-size:13px;color:#9EBEE8;margin:0;line-height:1.6}
.mobile-context .key{font-size:11px;letter-spacing:.18em;color:#5D7AA8;font-family:"Inter",sans-serif;text-transform:uppercase}

/* Shared utility */
.flex{display:flex}
.flex-col{display:flex;flex-direction:column}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-6{gap:24px}
.text-secondary{color:var(--ink-600)}
.text-placeholder{color:var(--ink-400)}
.text-primary{color:var(--primary)}
.text-accent{color:var(--accent)}
.text-success{color:var(--success)}
.text-warning{color:var(--warning)}
.text-danger{color:var(--danger)}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--card-shadow)}
.card-pad{padding:18px}

.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:500;border:1px solid transparent;line-height:1.5;font-family:inherit;white-space:nowrap}
.tag .d{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.tag-blue{background:#EEF4FB;color:#1A5FB4;border-color:#CFE0F4}
.tag-cyan{background:#E6F6F6;color:#0E7A7A;border-color:#B7E3E3}
.tag-green{background:#ECFDF5;color:#047857;border-color:#A7F3D0}
.tag-amber{background:#FEF3C7;color:#92400E;border-color:#FDE68A}
.tag-red{background:#FEE2E2;color:#991B1B;border-color:#FECACA}
.tag-grey{background:#F1F5F9;color:#475569;border-color:#E2E8F0}
.tag-deep{background:#0E2E5A;color:#fff;border-color:#0E2E5A}

.bilingual{display:flex;flex-direction:column;gap:1px;line-height:1.4}
.bilingual .zh{font-size:14px;color:var(--ink-900);font-weight:500}
.bilingual .en{font-size:12px;color:var(--ink-600);font-family:"Inter",sans-serif;letter-spacing:.01em}

/* Toast */
.toast-wrap{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#0F172A;color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;pointer-events:auto;animation:slideDown .25s ease}
.toast.success{background:#047857}
.toast.danger{background:#991B1B}
.toast.warning{background:#92400E}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

/* Drawer-like overlay */
.modal-bk{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:9000;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.modal-bk.right{justify-content:flex-end}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:12px;padding:24px;width:min(520px,90vw);box-shadow:0 24px 60px rgba(0,0,0,.2)}
.drawer{background:#fff;height:100%;width:min(560px,90vw);box-shadow:-12px 0 40px rgba(15,23,42,.18);display:flex;flex-direction:column;animation:slideLeft .25s}
@keyframes slideLeft{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

/* Buttons */
.btn{font-size:13px;padding:7px 16px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;justify-content:center;font-family:inherit;transition:all .15s;line-height:1.4}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-700)}
.btn-primary:disabled{background:#CBD5E1;cursor:not-allowed}
.btn-default{background:#fff;border-color:var(--line);color:var(--ink-900)}
.btn-default:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--primary);border-color:transparent}
.btn-ghost:hover{background:var(--primary-50)}
.btn-danger{background:#fff;border-color:#FECACA;color:var(--danger)}
.btn-danger:hover{background:#FEE2E2}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#047857}
.btn-lg{padding:11px 24px;font-size:14px}
.btn-block{width:100%}

/* Form */
.f-label{font-size:13px;color:var(--ink-700);font-weight:500;margin-bottom:6px;display:block}
.f-label .req{color:var(--danger);margin-right:2px}
.f-label .i{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--ink-400);color:var(--ink-400);font-size:9px;text-align:center;line-height:12px;margin-left:6px;cursor:help;font-style:normal;font-family:"Inter",sans-serif}
.f-input,.f-select,.f-textarea{width:100%;padding:7px 11px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;outline:none;transition:border-color .15s}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,95,180,.1)}
.f-input.err{border-color:var(--danger);background:#FEF2F2}
.f-help{font-size:11px;color:var(--ink-400);margin-top:4px}
.f-error{font-size:11px;color:var(--danger);margin-top:4px}
.f-row{display:grid;gap:16px}
.f-row-2{grid-template-columns:1fr 1fr}
.f-row-3{grid-template-columns:1fr 1fr 1fr}

/* Misc */
.divider{height:1px;background:var(--line);margin:16px 0}
.dot-sep{color:var(--ink-300);margin:0 8px}
.skeleton{background:linear-gradient(90deg,#F1F5F9 0%,#E2E8F0 50%,#F1F5F9 100%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* AntD overrides for our theme */
.ant-btn-primary{background:var(--primary) !important}
.ant-btn-primary:hover{background:var(--primary-700) !important}

/* Compact density per page */
.density-compact .card-pad{padding:14px}

/* Print-friendly report style */
.doc{background:#fff;font-family:"Noto Sans SC",sans-serif;color:#000;line-height:1.7}
.doc h1{font-size:22px;font-weight:600;text-align:center;margin:0 0 12px}
.doc h2{font-size:16px;font-weight:600;border-bottom:2px solid var(--primary);padding-bottom:6px;margin:24px 0 12px}
.doc table{width:100%;border-collapse:collapse;font-size:13px}
.doc table td,.doc table th{border:1px solid #94A3B8;padding:8px 12px;vertical-align:top}
.doc table th{background:#F1F5F9;font-weight:600;text-align:left}
.watermark{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:1}
.watermark-text{font-size:120px;font-weight:700;color:rgba(239,68,68,.10);transform:rotate(-30deg);letter-spacing:.2em;white-space:nowrap;font-family:"Inter",sans-serif}
</style>

</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;color:#475569;font-size:13px">
    <div style="width:48px;height:48px;border:3px solid #E2E8F0;border-top-color:#1A5FB4;border-radius:50%;animation:spin 1s linear infinite"></div>
    <div>正在加载原型 · Loading prototype...</div>
  </div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<script type="text/babel" data-presets="env,react" src="prototype/shared.jsx"></script>
<script type="text/babel" data-presets="env,react" src="prototype/portal-1.jsx"></script>
<script type="text/babel" data-presets="env,react" src="prototype/portal-2.jsx"></script>
<script type="text/babel" data-presets="env,react" src="prototype/portal-3.jsx"></script>
<script type="text/babel" data-presets="env,react" src="prototype/internal-1.jsx"></script>
<script type="text/babel" data-presets="env,react" src="prototype/internal-2.jsx"></script>
<script type="text/babel" data-presets="env,react" src="prototype/internal-3.jsx"></script>
<script type="text/babel" data-presets="env,react" src="prototype/mobile.jsx"></script>
<script type="text/babel" data-presets="env,react" src="prototype/app.jsx"></script>
</body>
